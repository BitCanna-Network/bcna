name: "Release"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Copy Binary
        env:
          GO_VERSION: "1.26.7"
        run: |
          ARCH=x86_64 PLATFORM=linux/amd64 make build-reproducible-generic
          ARCH=aarch64 PLATFORM=linux/arm64 make build-reproducible-generic
      - name: List files
        run: ls -la build/

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            build/bcnad_linux_amd64.tar.gz
            build/bcnad_darwin_arm64.tar.gz
            build/bcnad_sha256.txt
